<!DOCTYPE html>
<!--
* UBICACIÓN: OmniaMentis/manifestation/web_interface/fons_panel.html
* PROPÓSITO: Dashboard administrativo de El Fons — revisión de consultas
*            SILENS pendientes, decisiones sobre los 6 estados de
*            ConsultationStatus, heartbeat de presencia, y reincidencia.
* VERSIÓN: 1.0.0
* FECHA: 2026-06-29
* ESTADO: Producción
*
* DIFERENCIA con omnia_dashboard.html:
*   omnia_dashboard.html → interfaz de Stalin (conversación con Omnia)
*   fons_panel.html      → interfaz de El Fons (moderación ética)
*   Comparten estilo visual tech-noir pero sirven roles distintos.
*
* ENDPOINTS CONSUMIDOS (todos ya implementados en main_flask.py):
*   GET  /api/ethics/pending                    -- cola de consultas
*   GET  /api/ethics/recidivism/<user_id>        -- historial de un usuario
*   POST /api/ethics/fons/heartbeat              -- declarar presencia activa
*   GET  /api/ethics/fons/status                 -- ACTIVE/INACTIVE
*   POST /api/ethics/fons/decide/<consultation_id> -- tomar decisión
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL FONS — PANEL DE MODERACIÓN</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:      #000000;
  --bg-deep:    #030810;
  --bg-panel:   #040b18;
  --bg-card:    #071221;

  --neon-blue:  #00c8ff;
  --neon-dim:   #0088bb;
  --neon-cyan:  #00ffee;
  --neon-green: #00ff99;
  --neon-amber: #ffaa00;

  --text-bright: #e8f4ff;
  --text-main:   #b8d8f0;
  --text-sub:    #6a9ab8;
  --text-dim:    #3a6080;

  --border:     rgba(0,200,255,0.10);
  --border-hot: rgba(0,200,255,0.40);

  --danger:  #ff4466;
  --success: #00ff99;
  --warn:    #ffbb00;
  --critical: #ff2244;

  --font-mono: 'Courier New', Courier, monospace;
}

html, body {
  height: 100%;
  background: var(--black);
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 13px;
}

.shell {
  display: grid;
  grid-template-rows: 50px 1fr;
  min-height: 100vh;
}

/* ===== HEADER ===== */
.header {
  background: var(--bg-deep);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid var(--border-hot);
}
.brand {
  font-size: 13px;
  font-weight: bold;
  color: var(--neon-blue);
  letter-spacing: 0.2em;
  text-shadow: 0 0 10px rgba(0,200,255,0.6);
}
.brand span { color: var(--text-sub); font-weight: normal; margin-left: 8px; }

.hdr-right { display: flex; align-items: center; gap: 16px; }

.fons-status-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 12px;
  border-radius: 14px;
  font-size: 10px;
  letter-spacing: 0.1em;
  border: 1px solid var(--border);
}
.fons-status-pill.active {
  color: var(--success);
  border-color: rgba(0,255,153,0.4);
  background: rgba(0,255,153,0.08);
}
.fons-status-pill.inactive {
  color: var(--danger);
  border-color: rgba(255,68,102,0.4);
  background: rgba(255,68,102,0.08);
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}
.fons-status-pill.active .status-dot { animation: blink 2.2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

.heartbeat-btn {
  background: transparent;
  border: 1px solid var(--neon-blue);
  color: var(--neon-blue);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.12em;
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  text-transform: uppercase;
}
.heartbeat-btn:hover { background: var(--neon-blue); color: var(--black); }

/* ===== MAIN GRID ===== */
.main {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 1px;
  background: rgba(0,200,255,0.05);
}

.queue-panel, .side-panel {
  background: var(--bg-panel);
  padding: 18px;
  overflow-y: auto;
}

.section-title {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--text-sub);
  text-transform: uppercase;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pending-count {
  background: rgba(255,170,0,0.15);
  color: var(--neon-amber);
  border-radius: 10px;
  padding: 2px 9px;
  font-size: 10px;
}

/* ===== CONSULTATION CARDS ===== */
.consultation-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--text-dim);
  border-radius: 5px;
  padding: 16px;
  margin-bottom: 14px;
}
.consultation-card.risk-low    { border-left-color: var(--success); }
.consultation-card.risk-moderate { border-left-color: var(--warn); }
.consultation-card.risk-high   { border-left-color: var(--neon-amber); }
.consultation-card.risk-critical { border-left-color: var(--critical); }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}
.card-id {
  font-size: 11px;
  color: var(--neon-blue);
  font-weight: bold;
  letter-spacing: 0.05em;
}
.card-meta { font-size: 9.5px; color: var(--text-sub); margin-top: 2px; }

.risk-badge {
  font-size: 9px;
  letter-spacing: 0.1em;
  padding: 3px 9px;
  border-radius: 3px;
  text-transform: uppercase;
  white-space: nowrap;
}
.risk-badge.low      { background: rgba(0,255,153,0.15); color: var(--success); }
.risk-badge.moderate { background: rgba(255,187,0,0.15); color: var(--warn); }
.risk-badge.high     { background: rgba(255,170,0,0.2); color: var(--neon-amber); }
.risk-badge.critical { background: rgba(255,34,68,0.2); color: var(--critical); }

.card-msg {
  background: rgba(0,0,0,0.3);
  border-radius: 4px;
  padding: 10px 12px;
  margin: 10px 0;
  color: var(--text-bright);
  line-height: 1.55;
  font-size: 12.5px;
}
.card-reason {
  font-size: 10.5px;
  color: var(--text-sub);
  margin-bottom: 12px;
}
.card-reason b { color: var(--text-main); }

.card-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.action-btn {
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.06em;
  padding: 7px 12px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-main);
  text-transform: uppercase;
}
.action-btn:hover { border-color: var(--border-hot); }
.action-btn.approve { color: var(--success); border-color: rgba(0,255,153,0.3); }
.action-btn.approve:hover { background: rgba(0,255,153,0.1); }
.action-btn.reject { color: var(--danger); border-color: rgba(255,68,102,0.3); }
.action-btn.reject:hover { background: rgba(255,68,102,0.1); }
.action-btn.redirect { color: var(--neon-cyan); border-color: rgba(0,255,238,0.3); }
.action-btn.redirect:hover { background: rgba(0,255,238,0.1); }
.action-btn.respond { color: var(--neon-amber); border-color: rgba(255,170,0,0.3); }
.action-btn.respond:hover { background: rgba(255,170,0,0.1); }

.inline-form { display: none; margin-top: 12px; }
.inline-form.show { display: block; }
.inline-form textarea {
  width: 100%;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  color: var(--text-bright);
  font-family: inherit;
  font-size: 11.5px;
  padding: 8px;
  border-radius: 4px;
  resize: vertical;
  min-height: 60px;
}
.inline-form input[type="text"] {
  width: 100%;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  color: var(--text-bright);
  font-family: inherit;
  font-size: 11px;
  padding: 7px 9px;
  border-radius: 4px;
  margin-top: 6px;
}
.inline-form label {
  font-size: 9.5px;
  color: var(--text-sub);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: block;
  margin-top: 8px;
}
.inline-form .submit-btn {
  margin-top: 10px;
  background: var(--neon-blue);
  color: var(--black);
  border: none;
  font-weight: bold;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-state .big { font-size: 32px; margin-bottom: 10px; }

/* ===== SIDE PANEL ===== */
.recidivism-search {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.recidivism-search input {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-bright);
  font-family: inherit;
  font-size: 11px;
  padding: 7px 9px;
  border-radius: 4px;
}
.recidivism-search button {
  background: transparent;
  border: 1px solid var(--neon-blue);
  color: var(--neon-blue);
  font-family: inherit;
  font-size: 10px;
  padding: 7px 12px;
  border-radius: 4px;
  cursor: pointer;
}

.recidivism-result {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 12px;
  font-size: 11px;
  line-height: 1.7;
}
.recidivism-result .ban-warning {
  color: var(--danger);
  font-weight: bold;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,68,102,0.3);
}

.log-line {
  font-size: 9.5px;
  color: var(--text-sub);
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
}
.log-line.ok .val { color: var(--success); }
.log-line.err .val { color: var(--danger); }
.log-line .val { color: var(--text-main); }

/* ===== CONFIG MODAL (reusa patrón del dashboard de Stalin) ===== */
#cfgModal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.7); z-index: 999;
  align-items: center; justify-content: center;
}
#cfgModal .box {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 24px; max-width: 420px; width: 90%;
}
#cfgModal input {
  width: 100%; box-sizing: border-box;
  background: #060a14; border: 1px solid var(--border);
  color: var(--text-bright); padding: 8px 10px; border-radius: 4px;
  font-family: inherit; font-size: 13px; margin-bottom: 16px;
}
</style>
</head>
<body>
<div class="shell">

<header class="header">
  <div class="brand">EL FONS <span>// PANEL DE MODERACIÓN ÉTICA</span></div>
  <div class="hdr-right">
    <button id="cfgBtn" style="background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:4px;padding:5px 10px;cursor:pointer;font-family:inherit;font-size:10px;">⚙ API</button>
    <div class="fons-status-pill inactive" id="fonsStatusPill">
      <div class="status-dot"></div>
      <span id="fonsStatusText">VERIFICANDO...</span>
    </div>
    <button class="heartbeat-btn" id="heartbeatBtn">DECLARARME ACTIVO</button>
  </div>
</header>

<div id="cfgModal">
  <div class="box">
    <h3 style="color:var(--neon-blue);font-size:14px;margin-bottom:12px;letter-spacing:.05em;">CONFIGURAR BACKEND</h3>
    <p style="font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;">
      URL pública de la API de OmniaMentis (la misma que usa el dashboard de Stalin).
    </p>
    <input id="cfgInput" type="text" placeholder="http://localhost:8000">
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="cfgCancel" style="background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:4px;padding:8px 16px;cursor:pointer;font-family:inherit;font-size:12px;">Cancelar</button>
      <button id="cfgSave" style="background:var(--neon-blue);border:none;color:#04101f;border-radius:4px;padding:8px 16px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;">Guardar</button>
    </div>
  </div>
</div>

<main class="main">

  <section class="queue-panel">
    <div class="section-title">
      <span>cola de revisión silens</span>
      <span class="pending-count" id="pendingCount">0</span>
    </div>
    <div id="queueList">
      <div class="empty-state">
        <div class="big">⏳</div>
        <div>Cargando consultas pendientes...</div>
      </div>
    </div>
  </section>

  <aside class="side-panel">
    <div class="section-title">reincidencia por usuario</div>
    <div class="recidivism-search">
      <input id="recidUserInput" type="text" placeholder="user_id o IP">
      <button id="recidSearchBtn">VER</button>
    </div>
    <div class="recidivism-result" id="recidResult" style="display:none;"></div>

    <div class="section-title" style="margin-top:22px;">registro</div>
    <div id="sysLog"></div>
  </aside>

</main>
</div>

<script>
// ==================== CONFIG ====================
function resolveApiUrl() {
  const stored = localStorage.getItem('fons_api_url') || localStorage.getItem('omnia_api_url');
  if (stored) return stored;
  return 'http://localhost:8000';
}
let API = resolveApiUrl();

const RISK_LABELS = { low: 'BAJO', moderate: 'MODERADO', high: 'ALTO', critical: 'CRÍTICO' };

const $ = id => document.getElementById(id);
const ts = () => new Date().toLocaleTimeString('es', {hour:'2-digit',minute:'2-digit',second:'2-digit'});

function syslog(msg, type='') {
  const el = document.createElement('div');
  el.className = `log-line ${type}`;
  el.innerHTML = `<span>${ts()}</span> &nbsp;<span class="val">${msg}</span>`;
  const log = $('sysLog');
  log.prepend(el);
  if (log.children.length > 25) log.lastChild.remove();
}

// ==================== CONFIG MODAL ====================
const cfgModal = $('cfgModal'), cfgInput = $('cfgInput');
$('cfgBtn').addEventListener('click', () => { cfgInput.value = API; cfgModal.style.display = 'flex'; });
$('cfgCancel').addEventListener('click', () => cfgModal.style.display = 'none');
$('cfgSave').addEventListener('click', () => {
  const v = cfgInput.value.trim().replace(/\/$/, '');
  if (!v) return;
  API = v;
  localStorage.setItem('fons_api_url', API);
  cfgModal.style.display = 'none';
  syslog(`Backend reconfigurado: ${API}`, 'ok');
  refreshAll();
});

// ==================== FONS STATUS / HEARTBEAT ====================
async function checkFonsStatus() {
  try {
    const r = await fetch(`${API}/api/ethics/fons/status`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const pill = $('fonsStatusPill');
    if (d.is_active) {
      pill.className = 'fons-status-pill active';
      $('fonsStatusText').textContent = 'ACTIVO';
    } else {
      pill.className = 'fons-status-pill inactive';
      $('fonsStatusText').textContent = 'INACTIVO';
    }
  } catch (e) {
    syslog(`Error consultando estado del Fons: ${e.message}`, 'err');
  }
}

async function sendHeartbeat() {
  try {
    const r = await fetch(`${API}/api/ethics/fons/heartbeat`, { method: 'POST' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    syslog('Heartbeat enviado — declarado ACTIVO', 'ok');
    checkFonsStatus();
  } catch (e) {
    syslog(`Error enviando heartbeat: ${e.message}`, 'err');
  }
}
$('heartbeatBtn').addEventListener('click', sendHeartbeat);

// Heartbeat automático cada 5 minutos mientras el panel esté abierto
setInterval(sendHeartbeat, 5 * 60 * 1000);

// ==================== QUEUE ====================
async function loadQueue() {
  try {
    const r = await fetch(`${API}/api/ethics/pending`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    renderQueue(d.consultations || []);
    $('pendingCount').textContent = d.pending_count ?? d.consultations.length;
  } catch (e) {
    syslog(`Error cargando cola: ${e.message}`, 'err');
    $('queueList').innerHTML = `<div class="empty-state"><div class="big">⚠</div><div>No se pudo conectar con el backend</div></div>`;
  }
}

function renderQueue(consultations) {
  const list = $('queueList');
  if (!consultations.length) {
    list.innerHTML = `<div class="empty-state"><div class="big">✅</div><div>No hay consultas pendientes</div></div>`;
    return;
  }
  list.innerHTML = '';
  consultations.forEach(c => list.appendChild(buildCard(c)));
}

function buildCard(c) {
  const risk = (c.analysis?.risk_level || 'low').toLowerCase();
  const card = document.createElement('div');
  card.className = `consultation-card risk-${risk}`;
  card.dataset.id = c.consultation_id;

  card.innerHTML = `
    <div class="card-top">
      <div>
        <div class="card-id">${c.consultation_id}</div>
        <div class="card-meta">${(c.timestamp||'').replace('T',' ').slice(0,19)} · usuario: ${c.user_id || 'anon'}</div>
      </div>
      <div class="risk-badge ${risk}">${RISK_LABELS[risk] || risk}</div>
    </div>
    <div class="card-msg">${escapeHtml(c.user_message || '')}</div>
    <div class="card-reason"><b>Razón:</b> ${escapeHtml(c.analysis?.reason || '—')}</div>
    <div class="card-actions">
      <button class="action-btn approve" data-action="approved">✓ Aprobar</button>
      <button class="action-btn reject" data-action="rejected">✗ Rechazar</button>
      <button class="action-btn redirect" data-action="redirected">↪ Redirigir</button>
      <button class="action-btn respond" data-action="responded_personally">✎ Responder yo</button>
    </div>
    <div class="inline-form" data-form="redirected">
      <label>Respuesta alternativa (obligatoria)</label>
      <textarea placeholder="Escribe la respuesta que Omnia debería dar en su lugar..."></textarea>
      <label>Criterio aprendido (opcional)</label>
      <input type="text" placeholder="Ej: siempre incluir recursos de apoyo">
      <button class="action-btn submit-btn" data-submit="redirected">Confirmar redirección</button>
    </div>
    <div class="inline-form" data-form="responded_personally">
      <label>Tu respuesta personal (obligatoria)</label>
      <textarea placeholder="Escribe tu respuesta completa como El Fons..."></textarea>
      <label>Criterio aprendido (opcional)</label>
      <input type="text" placeholder="Ej: priorizar seguridad sobre completitud">
      <button class="action-btn submit-btn" data-submit="responded_personally">Confirmar respuesta</button>
    </div>
    <div class="inline-form" data-form="approved">
      <label>Criterio aprendido (opcional)</label>
      <input type="text" placeholder="Si lo completas, esta decisión se marca como 'learned'">
      <button class="action-btn submit-btn" data-submit="approved">Confirmar aprobación</button>
    </div>
  `;

  card.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'rejected') {
        decide(c.consultation_id, action, null, '', card);
        return;
      }
      // approved / redirected / responded_personally muestran formulario inline
      card.querySelectorAll('.inline-form').forEach(f => f.classList.remove('show'));
      const form = card.querySelector(`[data-form="${action}"]`);
      if (form) form.classList.add('show');
    });
  });

  card.querySelectorAll('[data-submit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.submit;
      const form = btn.closest('.inline-form');
      const textarea = form.querySelector('textarea');
      const guidanceInput = form.querySelector('input[type="text"]');
      const modifiedResponse = textarea ? textarea.value.trim() : null;
      const guidance = guidanceInput ? guidanceInput.value.trim() : '';

      if ((action === 'redirected' || action === 'responded_personally') && !modifiedResponse) {
        alert('Este tipo de decisión requiere escribir una respuesta.');
        return;
      }
      decide(c.consultation_id, action, modifiedResponse, guidance, card);
    });
  });

  return card;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function decide(consultationId, action, modifiedResponse, guidance, cardEl) {
  try {
    const body = { action };
    if (modifiedResponse) body.modified_response = modifiedResponse;
    if (guidance) body.guidance = guidance;

    const r = await fetch(`${API}/api/ethics/fons/decide/${consultationId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!r.ok) {
      const errData = await r.json().catch(() => ({}));
      throw new Error(errData.error || `HTTP ${r.status}`);
    }

    const d = await r.json();
    syslog(`${consultationId} → ${d.action.toUpperCase()}`, 'ok');
    cardEl.style.opacity = '0.3';
    cardEl.style.pointerEvents = 'none';
    setTimeout(() => { cardEl.remove(); loadQueue(); }, 600);
  } catch (e) {
    syslog(`Error en decisión ${consultationId}: ${e.message}`, 'err');
    alert(`No se pudo registrar la decisión: ${e.message}`);
  }
}

// ==================== RECIDIVISM ====================
$('recidSearchBtn').addEventListener('click', async () => {
  const userId = $('recidUserInput').value.trim();
  if (!userId) return;
  try {
    const r = await fetch(`${API}/api/ethics/recidivism/${encodeURIComponent(userId)}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const box = $('recidResult');
    box.style.display = 'block';
    box.innerHTML = `
      <div>Usuario: <b>${escapeHtml(d.user_id)}</b></div>
      <div>Incidentes (${d.window_hours}h): <b>${d.incident_count} / ${d.threshold}</b></div>
      ${d.ban_recommended ? '<div class="ban-warning">⚠ BANEO RECOMENDADO</div>' : ''}
    `;
  } catch (e) {
    syslog(`Error consultando reincidencia: ${e.message}`, 'err');
  }
});

// ==================== BOOT ====================
async function refreshAll() {
  await checkFonsStatus();
  await loadQueue();
}

refreshAll();
setInterval(refreshAll, 20000); // refresco automático cada 20s
syslog('Panel del Fons iniciado');
</script>
